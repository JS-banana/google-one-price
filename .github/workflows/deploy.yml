name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Most same-day Frankfurter rates are available by late UTC evening. Avoid the top of the hour.
    - cron: "17 22 * * *"

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    if: |
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://googleone.laifuyou.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Restore last validated exchange rates
        id: fx-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/frankfurter-fx.json
          # Updating the committed baseline starts a new cache sequence.
          key: frankfurter-fx-v1-${{ hashFiles('src/data/fx.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: frankfurter-fx-v1-${{ hashFiles('src/data/fx.json') }}-

      - name: Fetch and validate Frankfurter rates
        id: fx
        shell: bash
        env:
          FX_PREVIOUS_PATH: ${{ runner.temp }}/frankfurter-fx.json
        run: |
          if pnpm fx:update --live; then
            cp src/data/fx.live.json "$FX_PREVIOUS_PATH"
            echo 'validated=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            echo '::error::Frankfurter refresh failed. The scheduled deployment was stopped.'
            exit 1
          else
            if [[ -f "$FX_PREVIOUS_PATH" ]]; then
              cp "$FX_PREVIOUS_PATH" src/data/fx.live.json
              fallback='the last validated cache, with the committed baseline as backup'
            else
              fallback='the committed baseline (src/data/fx.json)'
            fi
            message="Frankfurter refresh failed. Continuing deployment with $fallback."
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save validated exchange rates
        if: steps.fx.outputs.validated == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/frankfurter-fx.json
          key: ${{ steps.fx-cache.outputs.cache-primary-key }}

      - run: pnpm build
        env:
          FX_LIVE: "1"

      - name: Confirm this commit is still on top of main
        id: main
        shell: bash
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "$(git rev-parse HEAD)" == "${main_ref%%$'\t'*}" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Skipping deployment because main has advanced.'
          fi

      - name: Deploy static assets to Cloudflare Workers
        if: steps.main.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
