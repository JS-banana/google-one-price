name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Most same-day Frankfurter rates are available by late UTC evening. Avoid the top of the hour.
    - cron: "17 22 * * *"

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    if: |
      !cancelled() && (
        (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && needs.check.result == 'success') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://googleone.laifuyou.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          FX_LIVE: "1"

      - name: Confirm this commit is still on top of main
        id: main
        shell: bash
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "$(git rev-parse HEAD)" == "${main_ref%%$'\t'*}" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Skipping deployment because main has advanced.'
          fi

      - name: Deploy static assets to Cloudflare Workers
        if: steps.main.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
